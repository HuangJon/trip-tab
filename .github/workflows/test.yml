name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:e2e
      - run: npx --yes firebase-tools@15 emulators:exec --only firestore,auth --project demo-trip-tab "node tests/emulator/firestore.emulator.js && node tests/emulator/browser.emulator.js"
